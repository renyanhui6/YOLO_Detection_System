[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log

[program:knowledge]
directory=/app
command=python server_python/app.py
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/var/log/knowledge.out.log
stderr_logfile=/var/log/knowledge.err.log

[program:api]
directory=/app
command=python server_python/api_server.py
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/var/log/api.out.log
stderr_logfile=/var/log/api.err.log

[program:yolo]
directory=/app
command=python yolo_server/app.py
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
stdout_logfile=/var/log/yolo.out.log
stderr_logfile=/var/log/yolo.err.log

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.out.log
stderr_logfile=/var/log/nginx.err.log
